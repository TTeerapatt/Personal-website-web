services:
  personal-website-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3006/personal-website/api/}
    image: personal-website-web:latest
    container_name: personal-website-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3008}:3008"
    environment:
      NODE_ENV: production
      PORT: 3008
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3008)+'/personal-website').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
